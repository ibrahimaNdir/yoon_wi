name: yoon_wi
description: "Yoon Wi : les transports en commun de Dakar, étape par étape."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  go_router: ^17.0.0
  dartz: ^0.10.1
  shared_preferences: ^2.5.3
  geolocator: ^14.0.2
  permission_handler: 12.0.3
  share_plus: ^12.0.2
  connectivity_plus: ^7.3.1
  intl: ^0.20.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  geolocator_android: 5.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0E7C5A"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icons/app_icon_monochrome.png"
  min_sdk_android: 21